<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete the Sentences - Prepositions of Place</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    :root {
        /* COLORES OFICIALES CISUR */
        --cisur-navy: #051c4a;
        --cisur-yellow: #fccb10;
        --cisur-yellow-dark: #cfa50a;
        --cisur-teal: #005b6e;
        --cisur-white: #ffffff;
        
        /* Colores complementarios para el videojuego */
        --canvas-sky: #e0f7fa;
        --wrong-red: #ff4757;
        --correct-green: #2ed573;
    }

    body {
        font-family: 'Nunito', sans-serif;
        background: radial-gradient(circle at 50% 50%, #0a2e73, var(--cisur-navy));
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center; 
        padding: 100px 20px 40px 20px; /* Espacio superior para el escudo */
        color: var(--cisur-white);
        overflow-y: auto; 
    }

    /* CONTENEDOR PRINCIPAL - ESTILO MÁQUINA ARCADE */
    .game-card {
        position: relative;
        background: var(--cisur-white);
        border-radius: 10px;
        width: 100%;
        max-width: 800px;
        padding: 40px 30px 25px;
        text-align: center;
        box-shadow: 
            0 0 0 6px var(--cisur-yellow),
            0 0 0 16px var(--cisur-navy),
            0 20px 50px rgba(0,0,0,0.9);
        color: var(--cisur-navy);
        margin: auto;
    }

    /* EFECTO SCANLINES (CRT TV) */
    .game-card::after {
        content: " ";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        border-radius: 10px;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.05) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
        z-index: 2;
        background-size: 100% 4px, 3px 100%;
        pointer-events: none;
    }

    /* HEADER Y LOGO */
    .credits-header {
        position: absolute;
        top: -95px; /* Posición por encima de la caja */
        left: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        color: var(--cisur-white);
        font-size: 0.9rem;
        font-family: 'Press Start 2P', cursive;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-shadow: 3px 3px 0px rgba(0,0,0,0.5);
        z-index: 10;
    }
    
    .school-logo {
        height: 75px;
        width: 75px;
        border-radius: 50%;
        box-shadow: 0 4px 15px rgba(252, 203, 16, 0.5);
        border: 3px solid var(--cisur-white);
        background-color: var(--cisur-navy);
    }

    /* TÍTULOS DEL JUEGO */
    h1.title {
        font-family: 'Press Start 2P', cursive;
        font-size: 1.6rem;
        line-height: 1.5;
        color: var(--cisur-navy);
        text-transform: uppercase;
        margin-bottom: 15px;
        text-shadow: 3px 3px 0px rgba(0,0,0,0.1);
    }
    h1.title span { color: var(--cisur-teal); }

    p.subtitle {
        font-size: 1.1rem;
        font-weight: 900;
        color: #333;
        margin-bottom: 25px;
        line-height: 1.5;
        padding: 0 20px;
    }

    /* BOTONES PRINCIPALES (START / AGAIN) */
    .btn-main {
        background: var(--cisur-yellow);
        color: var(--cisur-navy);
        border: 4px solid var(--cisur-navy);
        border-radius: 0px; 
        padding: 15px 30px;
        font-size: 1.2rem;
        font-family: 'Press Start 2P', cursive;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 6px 6px 0 var(--cisur-navy);
        margin-top: 15px;
        transition: all 0.1s;
        position: relative;
        z-index: 10;
    }
    .btn-main:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 var(--cisur-navy); }
    .btn-main:hover { background: #fff; }

    /* HUD (Puntaje y racha) */
    .hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #000;
        color: var(--cisur-white);
        padding: 15px 20px;
        border: 4px solid var(--cisur-teal);
        font-size: 0.8rem;
        font-family: 'Press Start 2P', cursive;
        margin-bottom: 15px;
        flex-wrap: wrap; 
        gap: 10px;
        box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
    }
    .hud span { color: var(--cisur-yellow); text-shadow: 1px 1px 0 #fff; }

    /* TEMPORIZADOR - PISTA DE ATLETISMO */
    .trail-container {
        position: relative;
        width: 100%;
        height: 25px;
        margin-bottom: 15px;
        background: #000;
        border: 4px solid #333;
    }
    .trail-fill {
        position: absolute;
        top: 0; left: 0;
        height: 100%;
        background: var(--correct-green);
        width: 100%;
        transition: width 0.05s linear;
    }
    .trail-marker {
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 1.8rem;
        left: 100%;
        transition: left 0.05s linear;
        z-index: 5;
    }

    /* ESCENARIO DEL JUEGO */
    .scene-box {
        background: var(--canvas-sky);
        border: 6px solid var(--cisur-navy);
        padding: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 20px;
        box-shadow: 6px 6px 0px rgba(0,0,0,0.1);
        position: relative;
        z-index: 5;
    }
    canvas { background: transparent; max-width: 100%; height: auto; }

    /* ORACIÓN PARA COMPLETAR */
    .sentence-display {
        font-family: 'Fredoka One', cursive;
        font-size: 1.9rem;
        color: var(--cisur-navy);
        margin-bottom: 20px;
        display: inline-block;
        font-weight: 900;
    }
    .sentence-display .blank {
        color: #999;
        border-bottom: 4px dashed #999;
        padding: 0 15px;
        transition: all 0.3s;
    }

    /* BOTONES DE OPCIONES MÚLTIPLES */
    .choices-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
        gap: 15px;
        position: relative;
        z-index: 10;
    }

    .choice-btn {
        background: var(--cisur-teal);
        border: 4px solid var(--cisur-navy);
        padding: 15px 10px;
        color: var(--cisur-white);
        font-family: 'Press Start 2P', cursive;
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 0.1s;
        box-shadow: 4px 4px 0 var(--cisur-navy);
    }
    .choice-btn:hover { background: #007c96; transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--cisur-navy); }
    .choice-btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0 var(--cisur-navy); }
    .choice-btn:disabled { cursor: default; transform: none; box-shadow: 4px 4px 0 var(--cisur-navy); }

    .correct-btn {
        background: var(--correct-green) !important;
        color: var(--cisur-navy) !important;
        animation: pop 0.3s ease;
    }
    .wrong-btn {
        background: var(--wrong-red) !important;
        color: #fff !important;
    }

    @keyframes pop {
        0% { transform: scale(1); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
    }

    /* BOTÓN SIGUIENTE OBLIGATORIO */
    .btn-next-container {
        margin-top: 25px;
        min-height: 60px;
        position: relative;
        z-index: 10;
    }
    #btn-next {
        display: none;
        background: #ff00ff;
        color: #fff;
        border: 4px solid #000;
        padding: 15px 30px;
        font-size: 1rem;
        font-family: 'Press Start 2P', cursive;
        cursor: pointer;
        box-shadow: 6px 6px 0 #000;
        animation: blinker 1s linear infinite;
        width: 100%;
        max-width: 350px;
        margin: 0 auto;
    }
    #btn-next:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 #000; animation: none; }

    @keyframes blinker {
        50% { opacity: 0.7; transform: scale(0.98); }
    }

    /* ESTAMPILLA DE PUNTUACIÓN FINAL */
    .stamp {
        display: inline-block;
        font-family: 'Press Start 2P', cursive;
        font-size: 2.5rem;
        color: var(--cisur-yellow);
        background: #000;
        border: 6px solid var(--cisur-yellow);
        padding: 20px 40px;
        margin: 30px 0;
        box-shadow: 8px 8px 0px var(--cisur-navy);
    }

    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn 0.3s ease; }
    
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
</style>
</head>
<body>

<div class="game-card">
    <div class="credits-header">
        <img src="image_e81ebf.png" alt="CISUR Logo" class="school-logo" onerror="this.style.display='none'">
        <div>Institución Educativa Ciudadela del Sur</div>
    </div>

    <!-- START SCREEN -->
    <div id="start-screen" class="screen active">
        <h1 class="title">🏃‍♂️ COMPLETE THE<br><span>SENTENCES</span></h1>
        <p class="subtitle">
            Look at the scene! Where is the object? Choose the correct preposition of place. 
            <br><br><b>The clock is ticking... You have 15 seconds! ⏱️</b>
        </p>
        <button class="btn-main" onclick="startGame()">INSERT COIN</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen">
        <div class="hud">
            <div>STAGE:<span id="question-num">1</span>/50</div>
            <div>COMBO:<span id="streak">0</span></div>
            <div>SCORE:<span id="score">0</span></div>
        </div>

        <div class="trail-container">
            <div id="trail-fill" class="trail-fill"></div>
            <div id="trail-marker" class="trail-marker">🏃‍♂️</div>
        </div>

        <div class="scene-box">
            <canvas id="sceneCanvas" width="400" height="220"></canvas>
        </div>

        <div id="sentence" class="sentence-display">The boy is <span class="blank" id="word-blank">_____</span> the tree.</div>

        <div class="choices-grid">
            <button class="choice-btn" id="btn-0" onclick="makeChoice(0)">NEXT TO</button>
            <button class="choice-btn" id="btn-1" onclick="makeChoice(1)">ON</button>
            <button class="choice-btn" id="btn-2" onclick="makeChoice(2)">UNDER</button>
            <button class="choice-btn" id="btn-3" onclick="makeChoice(3)">IN</button>
        </div>
        
        <div class="btn-next-container">
            <button id="btn-next" onclick="nextQuestion()">NEXT STAGE ➔</button>
        </div>
    </div>

    <!-- END SCREEN -->
    <div id="end-screen" class="screen">
        <h1 class="title">🏅 STAGE<br>CLEARED!</h1>
        <div class="stamp" id="final-score">0</div>
        <div><button class="btn-main" onclick="startGame()">PLAY AGAIN</button></div>
    </div>
</div>

<script>
    const ALL_PREPS = ["NEXT TO", "ON", "UNDER", "IN", "BETWEEN", "BEHIND", "IN FRONT OF", "ABOVE", "BELOW"];

    const rawQuestions = [
        { prep: "NEXT TO",    subjectEmoji: "👦", objectEmoji: "🌳", subjectName: "boy",     objectName: "tree" },
        { prep: "NEXT TO",    subjectEmoji: "🐕", objectEmoji: "🐱", subjectName: "dog",     objectName: "cat" },
        { prep: "NEXT TO",    subjectEmoji: "👧", objectEmoji: "🏫", subjectName: "girl",    objectName: "school" },
        { prep: "NEXT TO",    subjectEmoji: "🚗", objectEmoji: "🏠", subjectName: "car",     objectName: "house" },
        { prep: "NEXT TO",    subjectEmoji: "💡", objectEmoji: "🛏️", subjectName: "lamp",    objectName: "bed" },
        { prep: "NEXT TO",    subjectEmoji: "⛵", objectEmoji: "⚓", subjectName: "boat",    objectName: "dock" },
        { prep: "NEXT TO",    subjectEmoji: "🚲", objectEmoji: "🏠", subjectName: "bike",    objectName: "house" },

        { prep: "ON",         subjectEmoji: "🍎", objectEmoji: "🪑", subjectName: "apple",   objectName: "chair" },
        { prep: "ON",         subjectEmoji: "📚", objectEmoji: "🪑", subjectName: "book",    objectName: "chair" },
        { prep: "ON",         subjectEmoji: "🚗", objectEmoji: "🛏️", subjectName: "toy car", objectName: "bed" },
        { prep: "ON",         subjectEmoji: "💡", objectEmoji: "🪑", subjectName: "lamp",    objectName: "table" },
        { prep: "ON",         subjectEmoji: "🐱", objectEmoji: "🏠", subjectName: "cat",     objectName: "roof" },
        { prep: "ON",         subjectEmoji: "🐦", objectEmoji: "🌳", subjectName: "bird",    objectName: "branch" },

        { prep: "UNDER",      subjectEmoji: "🐕", objectEmoji: "🌳", subjectName: "dog",     objectName: "tree" },
        { prep: "UNDER",      subjectEmoji: "👟", objectEmoji: "🛏️", subjectName: "shoes",   objectName: "bed" },
        { prep: "UNDER",      subjectEmoji: "🍎", objectEmoji: "🪑", subjectName: "apple",   objectName: "chair" },
        { prep: "UNDER",      subjectEmoji: "☂️", objectEmoji: "🌳", subjectName: "umbrella", objectName: "tree" },
        { prep: "UNDER",      subjectEmoji: "🐱", objectEmoji: "🪑", subjectName: "cat",     objectName: "table" },
        { prep: "UNDER",      subjectEmoji: "⚽", objectEmoji: "🚗", subjectName: "ball",    objectName: "car" },

        { prep: "IN",         subjectEmoji: "🐱", objectEmoji: "📦", subjectName: "cat",     objectName: "box" },
        { prep: "IN",         subjectEmoji: "🐟", objectEmoji: "🐠", subjectName: "fish",    objectName: "fishbowl" },
        { prep: "IN",         subjectEmoji: "🔑", objectEmoji: "📦", subjectName: "keys",    objectName: "box" },
        { prep: "IN",         subjectEmoji: "✏️", objectEmoji: "☕", subjectName: "pencil",  objectName: "cup" },
        { prep: "IN",         subjectEmoji: "🍎", objectEmoji: "🧺", subjectName: "apple",   objectName: "basket" },
        { prep: "IN",         subjectEmoji: "🐕", objectEmoji: "🚗", subjectName: "dog",     objectName: "car" },

        { prep: "BETWEEN",    subjectEmoji: "⚽", objectEmoji: "📦", subjectName: "ball",    objectName: "boxes" },
        { prep: "BETWEEN",    subjectEmoji: "🐱", objectEmoji: "🌳", subjectName: "cat",     objectName: "trees" },
        { prep: "BETWEEN",    subjectEmoji: "👦", objectEmoji: "🌳", subjectName: "boy",     objectName: "trees" },
        { prep: "BETWEEN",    subjectEmoji: "🚗", objectEmoji: "🏠", subjectName: "car",     objectName: "houses" },
        { prep: "BETWEEN",    subjectEmoji: "🐕", objectEmoji: "🪑", subjectName: "dog",     objectName: "chairs" },

        { prep: "BEHIND",     subjectEmoji: "👦", objectEmoji: "🌳", subjectName: "boy",     objectName: "tree" },
        { prep: "BEHIND",     subjectEmoji: "🐱", objectEmoji: "📦", subjectName: "cat",     objectName: "box" },
        { prep: "BEHIND",     subjectEmoji: "🚗", objectEmoji: "🏠", subjectName: "car",     objectName: "house" },
        { prep: "BEHIND",     subjectEmoji: "🐕", objectEmoji: "🏠", subjectName: "dog",     objectName: "house" },
        { prep: "BEHIND",     subjectEmoji: "👧", objectEmoji: "🚪", subjectName: "girl",    objectName: "door" },

        { prep: "IN FRONT OF", subjectEmoji: "🚗", objectEmoji: "🏠", subjectName: "car",     objectName: "house" },
        { prep: "IN FRONT OF", subjectEmoji: "🐕", objectEmoji: "🏠", subjectName: "dog",     objectName: "house" },
        { prep: "IN FRONT OF", subjectEmoji: "👦", objectEmoji: "🌳", subjectName: "boy",     objectName: "tree" },
        { prep: "IN FRONT OF", subjectEmoji: "👧", objectEmoji: "🏫", subjectName: "girl",    objectName: "school" },
        { prep: "IN FRONT OF", subjectEmoji: "🐱", objectEmoji: "📦", subjectName: "cat",     objectName: "box" },

        { prep: "ABOVE",      subjectEmoji: "🎈", objectEmoji: "👦", subjectName: "balloon", objectName: "boy" },
        { prep: "ABOVE",      subjectEmoji: "☁️", objectEmoji: "🏠", subjectName: "cloud",   objectName: "house" },
        { prep: "ABOVE",      subjectEmoji: "🦅", objectEmoji: "⛰️", subjectName: "eagle",   objectName: "mountain" },
        { prep: "ABOVE",      subjectEmoji: "☀️", objectEmoji: "🌊", subjectName: "sun",     objectName: "sea" },
        { prep: "ABOVE",      subjectEmoji: "🪁", objectEmoji: "👦", subjectName: "kite",    objectName: "boy" },

        { prep: "BELOW",      subjectEmoji: "🐟", objectEmoji: "⛵", subjectName: "fish",    objectName: "boat" },
        { prep: "BELOW",      subjectEmoji: "🪱", objectEmoji: "🌳", subjectName: "worm",    objectName: "tree" },
        { prep: "BELOW",      subjectEmoji: "🐠", objectEmoji: "🧊", subjectName: "fish",    objectName: "iceberg" },
        { prep: "BELOW",      subjectEmoji: "🤿", objectEmoji: "⛵", subjectName: "diver",   objectName: "boat" },
        { prep: "BELOW",      subjectEmoji: "🦀", objectEmoji: "🚢", subjectName: "crab",    objectName: "ship" }
    ];

    let questions = rawQuestions.map(base => ({
        ...base,
        sentence: `The ${base.subjectName} is `,
        sentenceEnd: ` the ${base.objectName}.`
    }));

    let gameQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let streak = 0;
    let timerInterval;
    let remainingMs = 15000;
    let canPlay = true;
    let currentOptions = [];

    let audioCtx = null;
    
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;

        if (type === 'start') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'square';
            
            osc.frequency.setValueAtTime(261.63, now); 
            osc.frequency.setValueAtTime(329.63, now + 0.1); 
            osc.frequency.setValueAtTime(392.00, now + 0.2); 
            osc.frequency.setValueAtTime(523.25, now + 0.3); 
            
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.5);
            
            osc.start(now); osc.stop(now + 0.5);
            
        } else if (type === 'correct') {
            const osc1 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc1.connect(gain); gain.connect(audioCtx.destination);
            
            osc1.type = 'square'; 
            osc1.frequency.setValueAtTime(987.77, now); 
            osc1.frequency.setValueAtTime(1318.51, now + 0.1); 
            
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            
            osc1.start(now); osc1.stop(now + 0.4);
            
        } else if (type === 'wrong') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.4);
            
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.4);
            
            osc.start(now); osc.stop(now + 0.4);
            
        } else if (type === 'tick') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            osc.type = 'square'; 
            osc.frequency.setValueAtTime(800, now); 
            
            gain.gain.setValueAtTime(0.06, now); 
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05); 
            
            osc.start(now); osc.stop(now + 0.05);
        }
    }

    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function startGame() {
        initAudio();
        playSound('start');

        gameQuestions = shuffle(questions);
        currentIndex = 0;
        score = 0;
        streak = 0;
        document.getElementById('score').innerText = score;
        document.getElementById('streak').innerText = streak;
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('game-screen').classList.add('active');
        loadQuestion();
    }

    function drawScene(q) {
        const canvas = document.getElementById('sceneCanvas');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#2ed573"; 
        ctx.fillRect(0, 185, 400, 35);
        ctx.fillStyle = "#1e8c4a";
        for(let i=0; i<400; i+=20) {
            ctx.fillRect(i, 185, 10, 5);
        }

        ctx.font = "55px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const sEmoji = q.subjectEmoji;
        const oEmoji = q.objectEmoji;

        function dashedConnector(x, y1, y2) {
            ctx.save();
            ctx.strokeStyle = "var(--cisur-navy)";
            ctx.lineWidth = 4;
            ctx.setLineDash([8, 8]);
            ctx.beginPath();
            ctx.moveTo(x, y1);
            ctx.lineTo(x, y2);
            ctx.stroke();
            ctx.restore();
        }

        if (q.prep === "NEXT TO") {
            ctx.fillText(oEmoji, 130, 145);
            ctx.fillText(sEmoji, 270, 145);
        } else if (q.prep === "ON") {
            ctx.fillText(oEmoji, 200, 155);
            ctx.font = "45px sans-serif";
            ctx.fillText(sEmoji, 200, 95);
        } else if (q.prep === "UNDER") {
            ctx.fillText(oEmoji, 200, 100);
            ctx.font = "45px sans-serif";
            ctx.fillText(sEmoji, 200, 160);
        } else if (q.prep === "IN") {
            ctx.fillText(oEmoji, 200, 145);
            ctx.font = "38px sans-serif";
            ctx.fillText(sEmoji, 200, 140);
        } else if (q.prep === "BETWEEN") {
            ctx.fillText(oEmoji, 100, 145);
            ctx.fillText(oEmoji, 300, 145);
            ctx.font = "48px sans-serif";
            ctx.fillText(sEmoji, 200, 145);
        } else if (q.prep === "BEHIND") {
            ctx.font = "40px sans-serif";
            ctx.fillText(sEmoji, 170, 130);
            ctx.font = "60px sans-serif";
            ctx.fillText(oEmoji, 200, 145);
        } else if (q.prep === "IN FRONT OF") {
            ctx.font = "60px sans-serif";
            ctx.fillText(oEmoji, 180, 135);
            ctx.font = "45px sans-serif";
            ctx.fillText(sEmoji, 230, 155);
        } else if (q.prep === "ABOVE") {
            dashedConnector(200, 60, 150);
            ctx.font = "48px sans-serif";
            ctx.fillText(sEmoji, 200, 45);
            ctx.font = "50px sans-serif";
            ctx.fillText(oEmoji, 200, 165);
        } else if (q.prep === "BELOW") {
            ctx.font = "50px sans-serif";
            ctx.fillText(oEmoji, 200, 60);
            dashedConnector(200, 90, 170);
            ctx.font = "45px sans-serif";
            ctx.fillText(sEmoji, 200, 190);
        }
    }

    function loadQuestion() {
        if (currentIndex >= gameQuestions.length) {
            endGame();
            return;
        }

        canPlay = true;
        document.getElementById('btn-next').style.display = 'none';
        
        const q = gameQuestions[currentIndex];
        const blank = document.getElementById('word-blank');

        document.getElementById('question-num').innerText = currentIndex + 1;
        
        blank.innerText = '_____';
        blank.style.color = '#999';
        blank.style.borderBottomColor = '#999';
        
        document.getElementById('sentence').innerHTML =
            `${q.sentence}<span id="word-blank" class="blank">_____</span>${q.sentenceEnd}`;

        drawScene(q);

        const wrongPool = shuffle(ALL_PREPS.filter(p => p !== q.prep)).slice(0, 3);
        const options = shuffle([q.prep, ...wrongPool]);
        currentOptions = options;

        for (let i = 0; i < 4; i++) {
            const btn = document.getElementById(`btn-${i}`);
            btn.className = 'choice-btn';
            btn.innerText = options[i];
            btn.disabled = false;
        }

        startTimer();
    }

    function startTimer() {
        clearInterval(timerInterval);
        remainingMs = 15000;
        let lastTick = Math.ceil(remainingMs / 1000);
        
        const fill = document.getElementById('trail-fill');
        const marker = document.getElementById('trail-marker');
        fill.style.width = '100%';
        marker.style.left = '100%';

        timerInterval = setInterval(() => {
            if(!canPlay) return; 
            
            remainingMs -= 50;
            const pct = Math.max(0, (remainingMs / 15000) * 100);
            fill.style.width = pct + '%';
            marker.style.left = pct + '%';

            let currentTick = Math.ceil(remainingMs / 1000);
            if (currentTick < lastTick && remainingMs > 0) {
                playSound('tick');
                lastTick = currentTick;
            }

            if (remainingMs <= 0) {
                clearInterval(timerInterval);
            }
        }, 50);
    }

    function makeChoice(idx) {
        if (!canPlay) return;
        canPlay = false;
        clearInterval(timerInterval);

        const q = gameQuestions[currentIndex];
        const blank = document.getElementById('word-blank');

        blank.innerText = q.prep;
        blank.style.borderBottomColor = 'transparent';

        if (idx >= 0 && currentOptions[idx] === q.prep) {
            playSound('correct');
            document.getElementById(`btn-${idx}`).classList.add('correct-btn');
            blank.style.color = 'var(--correct-green)';
            score += 100 + (streak * 20);
            streak++;
        } else {
            playSound('wrong');
            if (idx >= 0) document.getElementById(`btn-${idx}`).classList.add('wrong-btn');
            for (let i = 0; i < 4; i++) {
                if (currentOptions[i] === q.prep) {
                    document.getElementById(`btn-${i}`).classList.add('correct-btn');
                }
            }
            blank.style.color = 'var(--wrong-red)';
            streak = 0;
        }

        document.getElementById('score').innerText = score;
        document.getElementById('streak').innerText = streak;

        for (let i = 0; i < 4; i++) {
            document.getElementById(`btn-${i}`).disabled = true;
        }

        document.getElementById('btn-next').style.display = 'inline-block';
    }

    function nextQuestion() {
        currentIndex++;
        loadQuestion();
    }

    function endGame() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('end-screen').classList.add('active');
        document.getElementById('final-score').innerText = score;
    }
</script>
