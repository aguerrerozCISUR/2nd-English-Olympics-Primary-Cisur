<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2nd English Olympic Games CISUR - Rhyme Time</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/twemoji.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        :root {
            --cisur-navy: #051c4a;
            --cisur-yellow: #fccb10;
            --cisur-yellow-dark: #cfa50a;
            --cisur-teal: #005b6e;
            --cisur-white: #ffffff;
            
            --canvas-sky: #e0f7fa;
            --wrong-red: #ff4757;
            --correct-green: #2ed573;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: radial-gradient(circle at 50% 50%, #0a2e73, var(--cisur-navy));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center; 
            padding: 100px 20px 40px 20px; 
            color: var(--cisur-white);
            overflow-y: auto; 
        }

        .game-card {
            position: relative;
            background: var(--cisur-white);
            border-radius: 10px;
            width: 100%;
            max-width: 800px;
            padding: 40px 30px 25px;
            text-align: center;
            box-shadow: 
                0 0 0 6px var(--cisur-yellow),
                0 0 0 16px var(--cisur-navy),
                0 20px 50px rgba(0,0,0,0.9);
            color: var(--cisur-navy);
            margin: auto;
        }

        /* EFECTO SCANLINES (CRT TV) */
        .game-card::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            border-radius: 10px;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.05) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 2;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        .credits-header {
            position: absolute;
            top: -95px; 
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            color: var(--cisur-white);
            font-size: 0.9rem;
            font-family: 'Press Start 2P', cursive;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.5);
            z-index: 10;
        }
        
        .school-logo {
            height: 75px;
            width: 75px;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(252, 203, 16, 0.5);
            border: 3px solid var(--cisur-white);
            background-color: var(--cisur-navy);
        }

        h1.title {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.5rem;
            line-height: 1.5;
            color: var(--cisur-navy);
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.1);
        }
        h1.title span { color: var(--cisur-teal); }

        p.subtitle {
            font-size: 1.1rem;
            font-weight: 900;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.5;
            padding: 0 20px;
        }

        .btn-main {
            background: var(--cisur-yellow);
            color: var(--cisur-navy);
            border: 4px solid var(--cisur-navy);
            border-radius: 0px; 
            padding: 15px 30px;
            font-size: 1.2rem;
            font-family: 'Press Start 2P', cursive;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 6px 6px 0 var(--cisur-navy);
            margin-top: 15px;
            transition: all 0.1s;
            position: relative;
            z-index: 10;
        }
        .btn-main:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 var(--cisur-navy); }
        .btn-main:hover { background: #fff; }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000;
            color: var(--cisur-white);
            padding: 15px 20px;
            border: 4px solid var(--cisur-teal);
            font-size: 0.8rem;
            font-family: 'Press Start 2P', cursive;
            margin-bottom: 15px;
            flex-wrap: wrap; 
            gap: 10px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
            position: relative;
            z-index: 5;
        }
        .hud span { color: var(--cisur-yellow); text-shadow: 1px 1px 0 #fff; }

        /* Timer Bar Visual de 15s */
        .timer-bar-container {
            position: relative;
            width: 100%;
            height: 25px;
            margin-bottom: 15px;
            background: #000;
            border: 4px solid #333;
            z-index: 5;
        }
        .timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--cisur-teal), #00d2d3, var(--cisur-yellow));
            transition: width 0.05s linear;
        }

        /* GAME BODY LAYOUT */
        .game-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
            position: relative;
            z-index: 5;
        }

        @media (max-width: 650px) {
            .game-body { grid-template-columns: 1fr; }
        }

        .target-box {
            background: var(--canvas-sky);
            border: 4px solid var(--cisur-navy);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
        }

        .target-emoji {
            font-size: 5rem;
            line-height: 1;
            margin-bottom: 10px;
        }

        .target-word {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.4rem;
            color: var(--cisur-navy);
            text-transform: uppercase;
        }

        .choices-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .choice-btn {
            background: var(--cisur-teal);
            border: 4px solid var(--cisur-navy);
            border-radius: 0px;
            padding: 12px 10px;
            color: var(--cisur-white);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 4px 4px 0 var(--cisur-navy);
            position: relative;
            transition: all 0.1s;
        }
        .choice-btn:hover { background: #007c96; transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--cisur-navy); }
        .choice-btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0 var(--cisur-navy); }
        .choice-btn:disabled { cursor: default; transform: none; box-shadow: 4px 4px 0 var(--cisur-navy); filter: brightness(0.9); }

        .choice-label {
            position: absolute;
            top: 4px;
            left: 6px;
            font-family: 'Press Start 2P', cursive;
            color: var(--cisur-navy);
            background: var(--cisur-yellow);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            border: 2px solid var(--cisur-navy);
        }

        .choice-emoji {
            font-size: 2.2rem;
            margin-bottom: 4px;
        }

        .choice-text {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .correct-btn {
            background: var(--correct-green) !important;
            color: var(--cisur-navy) !important;
            box-shadow: 4px 4px 0 var(--cisur-navy) !important;
            animation: pop 0.3s ease;
        }

        .wrong-btn {
            background: var(--wrong-red) !important;
            color: #fff !important;
            box-shadow: 4px 4px 0 var(--cisur-navy) !important;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* BOTÓN SIGUIENTE OBLIGATORIO */
        .btn-next-container {
            margin-top: 15px;
            min-height: 55px;
            position: relative;
            z-index: 10;
        }
        #btn-next {
            display: none;
            background: #ff00ff;
            color: #fff;
            border: 4px solid #000;
            padding: 15px 30px;
            font-size: 1rem;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            box-shadow: 6px 6px 0 #000;
            animation: blinker 1s linear infinite;
            width: 100%;
            max-width: 350px;
            margin: 0 auto;
        }
        #btn-next:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 #000; animation: none; }

        @keyframes blinker {
            50% { opacity: 0.7; transform: scale(0.98); }
        }

        .stamp {
            display: inline-block;
            font-family: 'Press Start 2P', cursive;
            font-size: 2.2rem;
            color: var(--cisur-yellow);
            background: #000;
            border: 6px solid var(--cisur-yellow);
            padding: 20px 30px;
            margin: 25px 0;
            box-shadow: 8px 8px 0px var(--cisur-navy);
        }

        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.3s ease; }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        img.emoji {
            height: 1em;
            width: 1em;
            margin: 0 0.05em 0 0.05em;
            vertical-align: -0.15em;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <div class="credits-header">
            <img src="image_e81ebf.png" alt="CISUR Logo" class="school-logo" onerror="this.style.display='none'">
            <div>Institución Educativa Ciudadela del Sur</div>
        </div>

        <!-- START SCREEN -->
        <div id="start-screen" class="screen active">
            <h1 class="title">⚡ RHYME TIME ⚡</h1>
            <p class="subtitle">
                Find the rhyming word!<br>
                <b>15 seconds per challenge. Teacher-controlled pace.</b>
            </p>
            <div style="font-size: 3rem; margin-bottom: 20px;">🐸 ↔️ 🐶 | 🐱 ↔️ 🎩</div>
            <button class="btn-main" onclick="startGame()">INSERT COIN</button>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen" class="screen">
            <div class="hud">
                <div>STAGE:<span id="question-num">1</span>/50</div>
                <div>COMBO:<span id="streak">0</span></div>
                <div>SCORE:<span id="score">0</span></div>
            </div>

            <div class="timer-bar-container">
                <div id="timer-bar" class="timer-bar"></div>
            </div>

            <div class="game-body">
                <div class="target-box">
                    <div id="target-emoji" class="target-emoji">🐸</div>
                    <div id="target-word" class="target-word">FROG</div>
                </div>

                <div class="choices-grid">
                    <button class="choice-btn" id="btn-0" onclick="makeChoice(0)">
                        <span class="choice-label">A</span>
                        <span class="choice-emoji" id="emoji-0">🐶</span>
                        <span class="choice-text" id="text-0">DOG</span>
                    </button>
                    <button class="choice-btn" id="btn-1" onclick="makeChoice(1)">
                        <span class="choice-label">B</span>
                        <span class="choice-emoji" id="emoji-1">👍</span>
                        <span class="choice-text" id="text-1">GOOD</span>
                    </button>
                    <button class="choice-btn" id="btn-2" onclick="makeChoice(2)">
                        <span class="choice-label">C</span>
                        <span class="choice-emoji" id="emoji-2">🔑</span>
                        <span class="choice-text" id="text-2">KEY</span>
                    </button>
                    <button class="choice-btn" id="btn-3" onclick="makeChoice(3)">
                        <span class="choice-label">D</span>
                        <span class="choice-emoji" id="emoji-3">🐟</span>
                        <span class="choice-text" id="text-3">FISH</span>
                    </button>
                </div>
            </div>

            <div class="btn-next-container">
                <button id="btn-next" onclick="nextQuestion()">NEXT STAGE ➔</button>
            </div>
        </div>

        <!-- END SCREEN -->
        <div id="end-screen" class="screen">
            <h1 class="title">GAME OVER! 🎉</h1>
            <div class="stamp" id="final-score">0 pts</div>
            <p id="feedback-msg" style="font-size: 1.1rem; color: #57606F; margin-bottom: 25px; font-weight: 900;"></p>
            <button class="btn-main" onclick="startGame()">PLAY AGAIN</button>
        </div>
    </div>

            { target: { word: "Book", emoji: "📕" }, correct: { word: "Cook", emoji: "🧑‍🍳" }, wrong: [{ word: "Pencil", emoji: "✏️" }, { word: "Pen", emoji: "🖊️" }, { word: "Bag", emoji: "🎒" }] },
            { target: { word: "Nest", emoji: "🪺" }, correct: { word: "Chest", emoji: "📦" }, wrong: [{ word: "Bird", emoji: "🐦" }, { word: "Egg", emoji: "🥚" }, { word: "Tree", emoji: "🌳" }] },
            { target: { word: "Lime", emoji: "🍋" }, correct: { word: "Time", emoji: "⏱️" }, wrong: [{ word: "Grape", emoji: "🍇" }, { word: "Apple", emoji: "🍎" }, { word: "Banana", emoji: "🍌" }] },
            { target: { word: "Car", emoji: "🚗" }, correct: { word: "Jar", emoji: "🫙" }, wrong: [{ word: "Bus", emoji: "🚌" }, { word: "Bike", emoji: "🚲" }, { word: "Wheel", emoji: "🛞" }] },
            { target: { word: "Sand", emoji: "🏖️" }, correct: { word: "Hand", emoji: "🤚" }, wrong: [{ word: "Wave", emoji: "🌊" }, { word: "Shell", emoji: "🐚" }, { word: "Fish", emoji: "🐟" }] },
            { target: { word: "Bell", emoji: "🔔" }, correct: { word: "Shell", emoji: "🐚" }, wrong: [{ word: "Bag", emoji: "🎒" }, { word: "Book", emoji: "📚" }, { word: "Pencil", emoji: "✏️" }] },
            { target: { word: "Cap", emoji: "🧢" }, correct: { word: "Map", emoji: "🗺️" }, wrong: [{ word: "Shirt", emoji: "👕" }, { word: "Shoe", emoji: "👟" }, { word: "Sock", emoji: "🧦" }] },
            { target: { word: "Toy", emoji: "🪀" }, correct: { word: "Boy", emoji: "👦" }, wrong: [{ word: "Girl", emoji: "👧" }, { word: "Dog", emoji: "🐕" }, { word: "Cat", emoji: "🐱" }] },
            { target: { word: "Kite", emoji: "🪁" }, correct: { word: "Bite", emoji: "🦷" }, wrong: [{ word: "Plane", emoji: "✈️" }, { word: "Cloud", emoji: "☁️" }, { word: "Bird", emoji: "🕊️" }] },
            { target: { word: "Chip", emoji: "🍟" }, correct: { word: "Ship", emoji: "🚢" }, wrong: [{ word: "Drink", emoji: "🥤" }, { word: "Pizza", emoji: "🍕" }, { word: "Burger", emoji: "🍔" }] },
            { target: { word: "Ring", emoji: "💍" }, correct: { word: "Wing", emoji: "🕊️" }, wrong: [{ word: "King", emoji: "👑" }, { word: "Gem", emoji: "💎" }, { word: "Coin", emoji: "🪙" }] },
            { target: { word: "Snow", emoji: "❄️" }, correct: { word: "Bow", emoji: "🏹" }, wrong: [{ word: "Rain", emoji: "🌧️" }, { word: "Wind", emoji: "💨" }, { word: "Sun", emoji: "☀️" }] },
            { target: { word: "Ice", emoji: "🧊" }, correct: { word: "Mice", emoji: "🐁" }, wrong: [{ word: "Milk", emoji: "🥛" }, { word: "Food", emoji: "🥪" }, { word: "Drink", emoji: "🥤" }] },
            { target: { word: "Stone", emoji: "🪨" }, correct: { word: "Bone", emoji: "🦴" }, wrong: [{ word: "Wood", emoji: "🪵" }, { word: "Leaf", emoji: "🌿" }, { word: "Flower", emoji: "🌻" }] },
            { target: { word: "Sting", emoji: "🐝" }, correct: { word: "King", emoji: "👑" }, wrong: [{ word: "Bug", emoji: "🐞" }, { word: "Fly", emoji: "🪰" }, { word: "Ant", emoji: "🐜" }] },
            { target: { word: "Town", emoji: "🏙️" }, correct: { word: "Clown", emoji: "🤡" }, wrong: [{ word: "House", emoji: "🏠" }, { word: "Street", emoji: "🚗" }, { word: "Park", emoji: "🌳" }] }
        ];

        let gameQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let streak = 0;
        let timerInterval;
        let canPlay = true;
        let currentOptions = [];
        let correctIndex = -1;

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(523.25, now); 
                osc.frequency.setValueAtTime(880, now + 0.15); 
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'tick') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'start' || type === 'win') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(600, now + 0.1);
                osc.frequency.setValueAtTime(800, now + 0.2);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            }
        }

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function fixEmojiRendering(el) {
            if (window.twemoji) {
                twemoji.parse(el || document.body, {
                    folder: 'svg',
                    ext: '.svg'
                });
            }
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            fixEmojiRendering(document.getElementById(id));
        }

        function startGame() {
            initAudio();
            playSound('start');
            gameQuestions = shuffle(rhymesData);
            currentIndex = 0;
            score = 0;
            streak = 0;
            document.getElementById('score').innerText = score;
            document.getElementById('streak').innerText = streak;
            showScreen('game-screen');
            loadQuestion();
        }

        function loadQuestion() {
            if (currentIndex >= gameQuestions.length) {
                endGame();
                return;
            }

            canPlay = true;
            document.getElementById('btn-next').style.display = 'none';
            const q = gameQuestions[currentIndex];

            document.getElementById('question-num').innerText = currentIndex + 1;
            document.getElementById('target-emoji').innerText = q.target.emoji;
            document.getElementById('target-word').innerText = q.target.word.toUpperCase();

            const choices = shuffle([
                { ...q.correct, isCorrect: true },
                { ...q.wrong[0], isCorrect: false },
                { ...q.wrong[1], isCorrect: false },
                { ...q.wrong[2], isCorrect: false }
            ]);

            currentOptions = choices;

            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`btn-${i}`);
                btn.className = 'choice-btn';
                btn.disabled = false;
                document.getElementById(`emoji-${i}`).innerText = choices[i].emoji;
                document.getElementById(`text-${i}`).innerText = choices[i].word.toUpperCase();

                if (choices[i].isCorrect) {
                    correctIndex = i;
                }
            }

            fixEmojiRendering(document.getElementById('game-screen'));
            startTimer();
        }

        // TEMPORIZADOR VISUAL DE 15 SEGUNDOS (Control Manual Total)
        function startTimer() {
            clearInterval(timerInterval);
            const timerBar = document.getElementById('timer-bar');
            timerBar.style.width = '100%';

            const totalMs = 15000;
            const intervalMs = 100;
            let elapsed = 0;
            let lastTickSecond = 15;

            timerInterval = setInterval(() => {
                if (!canPlay) return;

                elapsed += intervalMs;
                const percentage = Math.max(0, 100 - (elapsed / totalMs) * 100);
                timerBar.style.width = percentage + '%';

                let currentSecond = Math.ceil((totalMs - elapsed) / 1000);
                if (currentSecond < lastTickSecond && currentSecond >= 0) {
                    playSound('tick');
                    lastTickSecond = currentSecond;
                }

                if (elapsed >= totalMs) {
                    clearInterval(timerInterval);
                    // Al llegar a 0 no avanza solo; espera la interacción manual
                }
            }, intervalMs);
        }

        function makeChoice(selectedIndex) {
            if (!canPlay) return;
            canPlay = false;
            clearInterval(timerInterval);

            for (let i = 0; i < 4; i++) {
                document.getElementById(`btn-${i}`).disabled = true;
            }

            if (selectedIndex >= 0 && currentOptions[selectedIndex].isCorrect) {
                playSound('correct');
                document.getElementById(`btn-${selectedIndex}`).classList.add('correct-btn');
                score += 100 + (streak * 20);
                streak++;
            } else {
                playSound('wrong');
                if (selectedIndex >= 0) {
                    document.getElementById(`btn-${selectedIndex}`).classList.add('wrong-btn');
                }
                document.getElementById(`btn-${correctIndex}`).classList.add('correct-btn');
                streak = 0;
            }

            document.getElementById('score').innerText = score;
            document.getElementById('streak').innerText = streak;

            // MOSTRAR BOTÓN DE AVANCE OBLIGATORIO
            document.getElementById('btn-next').style.display = 'block';
        }

        function nextQuestion() {
            currentIndex++;
            loadQuestion();
        }

        function endGame() {
            playSound('win');
            showScreen('end-screen');
            document.getElementById('final-score').innerText = score + ' pts';

            const msg = document.getElementById('feedback-msg');
            if (score >= 4500) {
                msg.innerText = "🌟 UNBELIEVABLE! You are a master of rhymes!";
            } else if (score >= 2500) {
                msg.innerText = "🎉 FANTASTIC JOB! Great rhyming speed!";
            } else {
                msg.innerText = "👍 GOOD TRY! Practice again to increase your speed!";
            }
        }

        document.addEventListener('DOMContentLoaded', () => fixEmojiRendering(document.getElementById('start-screen')));
    </script>
</body>
</html>
